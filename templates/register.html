{% extends "base.html" %}
{% block title %}Đăng ký - {{ app_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h2>Tạo ví Hoàn Xu</h2>
  <form method="post">
    <label for="name">Họ tên</label>
    <input id="name" name="name" type="text" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="password">Mật khẩu (tối thiểu 6 ký tự)</label>
    <input id="password" name="password" type="password" required minlength="6">
    <button type="submit">Tạo ví miễn phí</button>
  </form>
  <p class="muted" style="margin-top:14px;">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
</div>
{% endblock %}
